name: Actualizar bolsas Melate

on:
  schedule:
    # 8:50am hora CDMX (UTC-6), los días con sorteo esa noche:
    # dom/mié/vie = Melate+Revancha+Revanchita, mar/sáb = Melate Retro.
    - cron: "50 14 * * 0,2,3,5,6"
    # 11:00pm hora CDMX la MISMA noche del sorteo (21:00 CDMX), para que el
    # resultado ya esté listo cuando la rutina de verificación corra a las
    # 11:30pm. 23:00 CDMX = 05:00 UTC del día siguiente (CDMX es UTC-6), por
    # eso los días aquí van corridos +1 respecto a los de arriba:
    # dom noche->lunes UTC, mar noche->miércoles UTC, mié noche->jueves UTC,
    # vie noche->sábado UTC, sáb noche->domingo UTC.
    - cron: "0 5 * * 0,1,3,4,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/actualizar_bolsas.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bolsas.json
          git diff --cached --quiet || git commit -m "Actualiza bolsas $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
