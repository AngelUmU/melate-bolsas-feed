name: Actualizar bolsas Melate

on:
  schedule:
    # 8:50am hora CDMX (UTC-6), los días con sorteo esa noche:
    # dom/mié/vie = Melate+Revancha+Revanchita, mar/sáb = Melate Retro.
    - cron: "50 14 * * 0,2,3,5,6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/actualizar_bolsas.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bolsas.json
          git diff --cached --quiet || git commit -m "Actualiza bolsas $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
